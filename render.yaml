services:
  - type: web
    name: alphacoders
    runtime: static
    buildCommand: npm ci && npm run build:hosted
    staticPublishPath: ./dist/web
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /app-config.json
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
